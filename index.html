  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #1a1410; overflow: hidden; font-family: 'Georgia', 'Hiragino Mincho ProN', serif; cursor: crosshair; }
    canvas { display: block; }

    /* minimal control hint (no title/branding) */
    #hint {
      position: fixed; bottom: 18px; right: 20px; z-index: 10;

    }
    #hint b { color: rgba(255,225,170,0.85); font-weight: normal; }
    #hint .flv { color: rgba(255,210,130,0.95); font-style: italic; }

    #sound-hint {
      position: fixed; bottom: 18px; left: 20px; z-index: 10;
      color: rgba(255,245,225,0.7); font-size: 12px; letter-spacing: 0.08em;
      pointer-events: none; user-select: none; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    #flash { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
             background: radial-gradient(ellipse at center, rgba(255,231,160,0.9) 0%, rgba(255,210,120,0.35) 35%, rgba(255,200,90,0) 70%); }
    #found { position: fixed; top: 38%; left: 50%; transform: translateX(-50%) scale(0.8); z-index: 11;
             color: #fff3c4; font-size: 30px; letter-spacing: 0.12em; opacity: 0; pointer-events: none; user-select: none;
             text-shadow: 0 0 18px rgba(255,200,80,0.9), 0 2px 6px rgba(0,0,0,0.6); }
    #taunt { position: fixed; top: 11%; left: 50%; transform: translateX(-50%); z-index: 11; white-space: nowrap;
             color: #ffe6ab; font-size: 25px; letter-spacing: 0.12em; opacity: 0; pointer-events: none; user-select: none;
             padding: 13px 30px; border-radius: 999px; border: 1px solid rgba(255,205,120,0.35);
             background: rgba(22,13,5,0.66); box-shadow: 0 0 26px rgba(0,0,0,0.5), inset 0 0 18px rgba(255,180,70,0.12);
             text-shadow: 0 0 14px rgba(255,180,60,0.7), 0 2px 5px rgba(0,0,0,0.8); }
    #taunt b { color: #fff6d6; font-weight: normal; border-bottom: 1px solid rgba(255,220,140,0.5); }

    /* title / intro overlay → fades out into the scene */
    #intro {
      position: fixed; inset: 0; z-index: 50; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse at center, #2a1c0c 0%, #140d05 70%, #0a0703 100%);
      opacity: 1; transition: opacity 1.3s ease;
    }
    #intro.hide { opacity: 0; pointer-events: none; }
    .intro-inner { animation: introIn 1.6s ease both; }
    @keyframes introIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .t-main { color: #f6e4b8; font-size: 46px; letter-spacing: 0.12em; text-shadow: 0 0 26px rgba(255,200,110,0.35);
              padding: 0 16px; line-height: 1.3; }
    .t-sub  { color: rgba(246,228,184,0.7); font-size: 17px; letter-spacing: 0.32em; margin-top: 16px; }
    .t-start { color: rgba(255,225,170,0.55); font-size: 13px; letter-spacing: 0.28em; margin-top: 54px;
               animation: blink 2.2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 0.85; } }

    #errbox { position: fixed; inset: 0; z-index: 99; display: none; color: #ffd; background: rgba(0,0,0,0.9);
              font-family: monospace; font-size: 13px; padding: 24px; white-space: pre-wrap; overflow: auto; }

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "cannon-es": "./vendor/cannon-es/cannon-es.js"

<script type="module">
const errbox = document.getElementById('errbox');
function fatal(e){ errbox.style.display='block'; errbox.textContent='Load error:\n'+(e && e.stack ? e.stack : e); console.error(e); }
window.addEventListener('error', ev => fatal(ev.error || ev.message));

import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ════════════════════════════════════════════════════════════════
// T003 — renderer + camera + scene + resize  (Setup)
// ════════════════════════════════════════════════════════════════
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e1) {
  try { renderer = new THREE.WebGLRenderer({ antialias: false }); }   // retry without AA
  catch (e2) {
    errbox.style.display = 'block';
    errbox.textContent =
      'WebGL を初期化できませんでした。\n\n' +
      '・VSCode の内蔵プレビュー / Simple Browser ではなく、\n' +
      '  Chrome・Safari・Firefox など通常のブラウザで\n' +
      '  http://localhost:8000/ を開いてください。\n' +
      '・ブラウザのハードウェアアクセラレーションを有効化してください\n' +
      '  (Chrome: 設定 → システム → 「ハードウェア アクセラレーションが使用可能な場合は使用する」をオン)。\n\n' +
      '--- detail ---\n' + (e2 && e2.message ? e2.message : e2);
    throw e2;
  }
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));          // capped (T027 / SC-006)
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
// fixed framing: looking slightly down at the tower zone on the floor (T007)
camera.position.set(0, 2.4, 8.2);
const LOOK_AT = new THREE.Vector3(0, 1.5, 0);
camera.lookAt(LOOK_AT);

// ════════════════════════════════════════════════════════════════
// T006 — worldview backdrop image (far, cover-fit)  (Foundational / FR-001)
// ════════════════════════════════════════════════════════════════
const IMG_ASPECT = 1672/941;
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color: 0x8a7a64, depthWrite: false })  // fallback tint until texture loads
);
backdrop.position.set(0, 3.2, -9);     // behind the action
backdrop.renderOrder = -1;
scene.add(backdrop);
// Backdrop room image (assets/haikei.png, 1672×941; cover-fit). Fallback tint if missing.
new THREE.TextureLoader().load('./assets/haikei.png', tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
  backdrop.material.map = tex; backdrop.material.color.set(0xffffff); backdrop.material.needsUpdate = true;
}, undefined, err => console.warn('backdrop haikei.png not found — using fallback color', err));

function fitBackdrop(){
  const dist = Math.abs(camera.position.z - backdrop.position.z);
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2) * dist;
  const w = h * camera.aspect;
  // cover-fit a plane of image aspect into the w×h frustum slice
  const planeAspect = w / h;
  let sw, sh;
  if (planeAspect > IMG_ASPECT) { sw = w; sh = w / IMG_ASPECT; } else { sh = h; sw = h * IMG_ASPECT; }
  backdrop.scale.set(sw * 1.04, sh * 1.04, 1);
}
fitBackdrop();

// ════════════════════════════════════════════════════════════════
// T008 — lighting matched to the warm room  (Foundational)
// ════════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0xfff0d8, 0.85));
const key = new THREE.DirectionalLight(0xffe6bc, 1.5);
key.position.set(4, 9, 5); key.castShadow = true;
key.shadow.mapSize.setScalar(2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 40;
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 10; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0006;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6b5030, 0.35));

// ════════════════════════════════════════════════════════════════
// T005 — cannon-es physics world + fixed-step helper  (Foundational)
// ════════════════════════════════════════════════════════════════
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });   // a touch heavy for toy snappiness
world.allowSleep = true;
world.solver.iterations = 12;
world.defaultContactMaterial.friction = 0.45;
world.defaultContactMaterial.restitution = 0.28;

const FIXED_DT = 1/60;
function stepPhysics(dt){ world.step(FIXED_DT, Math.min(dt, 0.1), 4); }

// ════════════════════════════════════════════════════════════════
// T007 — invisible ground plane + contact-shadow catcher  (Foundational)
// ════════════════════════════════════════════════════════════════
const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);   // face up (+Y)
world.addBody(groundBody);
// soft transparent shadow catcher so pieces look grounded on the depicted floor
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
shadowFloor.rotation.x = -Math.PI/2; shadowFloor.receiveShadow = true; scene.add(shadowFloor);

// invisible side walls (inward-facing) so scattered pieces stay roughly in frame
[[-7,0],[7,0],[0,-6],[0,6]].forEach(([x,z]) => {
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  // CANNON.Plane local normal is +Z; rotate so it points inward toward the origin
  if (x) b.quaternion.setFromEuler(0, x > 0 ? -Math.PI/2 : Math.PI/2, 0);  // right→-X, left→+X
  else   b.quaternion.setFromEuler(0, z > 0 ? Math.PI : 0, 0);             // front→-Z, back→+Z
  b.position.set(x, 0, z);
  world.addBody(b);
});

// ════════════════════════════════════════════════════════════════
// T011 — piece factory (block / teacup / minicar) + pool  (US1)
// T010 — Piece record {mesh, body, kind, home, inTower}
// ════════════════════════════════════════════════════════════════
const PIECE_POOL_MAX = 20;
const TOWER_TARGET   = 14;
const SPAWN_RADIUS   = 0.16;       // random horizontal offset → "出鱈目" lean (smaller = more stable, taller)
const BLOCK_COLORS = [0xE4533B, 0x4A86C5, 0x46B36B, 0xF2A93B, 0xB45CC0, 0xF2D04B, 0xE98AB0];

// 不思議なブロック textures — the toy is cut from its white background so the block
// reads as the toy's silhouette (not a white square). Canvas chroma-key, local, no CDN.
const BLOCK_FILES = [
  'block1.png','block2.png','block3.png','block4.png','block7.png','block8.png',
  'block9.png','block10.png','block11.png','block12.png','block13.png','block14.png','block15.png','block16.png',
];
const BLOCK_TEXTURES = new Array(BLOCK_FILES.length).fill(null);
function loadCutoutTexture(url, { bright = 232, chroma = 22 } = {}){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const id = ctx.getImageData(0, 0, w, h), d = id.data;
      for (let i = 0; i < d.length; i += 4){            // near-white + low-chroma → transparent
        const r=d[i], g=d[i+1], b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        if (mx >= bright && (mx - mn) <= chroma) d[i+3] = 0;
      }
      // 1px edge feather so alphaTest doesn't alias into a hard halo
      const a = new Uint8ClampedArray(w*h);
      for (let p=0,j=3;p<a.length;p++,j+=4) a[p]=d[j];
      for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){
        const p=y*w+x, c=a[p], s=(a[p-1]+a[p+1]+a[p-w]+a[p+w])>>2;
        if (c!==s) d[(p<<2)+3]=(c+s)>>1;
      }
      ctx.putImageData(id, 0, 0);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; tex.needsUpdate = true;
      resolve(tex);
    };
    img.onerror = reject; img.src = url;
  });
}
BLOCK_FILES.forEach((f, idx) => {
  loadCutoutTexture('./assets/block/' + f).then(tex => {
    BLOCK_TEXTURES[idx] = tex;
    for (const p of pieces){
      if (p.kind === 'block' && p.texSlot === idx){
        p.mesh.material.map = tex; p.mesh.material.needsUpdate = true;
        if (p.mesh.customDepthMaterial){ p.mesh.customDepthMaterial.map = tex; p.mesh.customDepthMaterial.needsUpdate = true; }
      }
    }
  }).catch(err => console.warn('cutout load failed', f, err));
});

function makeBlock(i){
  const s = 0.5 + Math.random()*0.16;
  const w = s, h = s, d = s * 0.42;                    // thin tile: real depth, face dominates
  const slot = i % BLOCK_FILES.length;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ map: BLOCK_TEXTURES[slot], color: 0xffffff,
      roughness: 0.6, metalness: 0.05, transparent: false, alphaTest: 0.5, side: THREE.DoubleSide }));
  // shadow respects the cutout (not the square box)
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: BLOCK_TEXTURES[slot], alphaTest: 0.5 });
  const body = new CANNON.Body({ mass: 1.0, shape: new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)), allowSleep:true, sleepSpeedLimit:0.3 });
  return { mesh, body, halfH: h/2, texSlot: slot };
}
const HOME = new THREE.Vector3(0, -6, 0);   // off-screen parking for pooled pieces
const pieces = [];
for (let i = 0; i < PIECE_POOL_MAX; i++){
  const built = makeBlock(i);
  built.mesh.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  scene.add(built.mesh);
  const p = { mesh: built.mesh, body: built.body, halfH: built.halfH, kind: 'block', texSlot: built.texSlot, home: HOME.clone(), inTower: false };
  p.body.position.set(HOME.x, HOME.y - i*1.2, HOME.z);   // stash apart, asleep
  p.body.sleep();
  world.addBody(p.body);
  pieces.push(p);
}
function syncPiece(p){
  p.mesh.position.copy(p.body.position);
  p.mesh.quaternion.copy(p.body.quaternion);
}

// ════════════════════════════════════════════════════════════════
// Toy people — cutout billboards of hito1.png / hito2.png (wander only in chaos)
// ════════════════════════════════════════════════════════════════
const FIGURE_H = 1.5;
function makeFigure(file, x, z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(FIGURE_H, FIGURE_H),
    new THREE.MeshStandardMaterial({ map:null, color:0xffffff, roughness:0.7, metalness:0.05,
      transparent:false, alphaTest:0.5, side:THREE.DoubleSide }));
  m.castShadow = true; m.position.set(x, FIGURE_H/2, z); scene.add(m);
  loadCutoutTexture('./assets/' + file).then(t => { m.material.map = t; m.material.needsUpdate = true; })
    .catch(err => console.warn(file + ' load failed', err));
  return m;
}
const builders = [ makeFigure('hito1.png', -1.7, 1.4), makeFigure('hito2.png', 1.7, 1.5) ];
function pickBuilderTarget(w){
  const ang = Math.random()*Math.PI*2, rad = 1.6 + Math.random()*2.8;
  w.target.set(Math.cos(ang)*rad, 0, 1.0 + Math.sin(ang)*rad*0.6);
  w.target.x = Math.max(-5.3, Math.min(5.3, w.target.x));
  w.target.z = Math.max(-3.3, Math.min(4.3, w.target.z));
}
builders.forEach((b, i) => {
  b.userData.w = { pos: b.position.clone(), target: b.position.clone(), yaw: 0, pause: Math.random()*2, step: 0, moving: false };
  pickBuilderTarget(b.userData.w);
});


// ════════════════════════════════════════════════════════════════
// kuruma — a wind-up toy CAR that drives around the floor (cutout billboard)
// distinct from the stacking blocks: it never stacks, it roams like a little car.
// ════════════════════════════════════════════════════════════════
const kuruma = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.05),
  new THREE.MeshStandardMaterial({ map:null, color:0xffffff, roughness:0.7, metalness:0.05,
    transparent:false, alphaTest:0.5, side:THREE.DoubleSide }));
kuruma.castShadow = true; kuruma.position.set(-3.5, 0.55, 2.6); scene.add(kuruma);
loadCutoutTexture('./assets/block/kuruma.png').then(t => { kuruma.material.map = t; kuruma.material.needsUpdate = true; })
  .catch(err => console.warn('kuruma load failed', err));
const car = { pos: new THREE.Vector3(-3.5, 0, 2.6), target: new THREE.Vector3(-3.5, 0, 2.6), pause: 0 };
function pickCarTarget(){
  car.target.set((Math.random()*2-1)*5.0, 0, 1.0 + (Math.random()*2-1)*3.0);
}
pickCarTarget();
function updateKuruma(dt, time){
  if (!chaosActive){ kuruma.lookAt(camera.position.x, kuruma.position.y, camera.position.z); return; }  // frozen in normal mode
  const SP = 1.9;
  if (car.pause > 0){ car.pause -= dt; }
  else {
    const to = new THREE.Vector3().subVectors(car.target, car.pos); to.y = 0;
    if (to.length() < 0.25){ car.pause = 0.3 + Math.random()*1.2; pickCarTarget(); }
    else { to.normalize(); car.pos.addScaledVector(to, SP*dt); }
  }
  car.pos.x = Math.max(-5.5, Math.min(5.5, car.pos.x));
  car.pos.z = Math.max(-3.5, Math.min(4.5, car.pos.z));
  const moving = car.pause <= 0;
  kuruma.position.set(car.pos.x, 0.55 + (moving ? Math.abs(Math.sin(time*14))*0.05 : 0), car.pos.z);  // little bounce while rolling
  kuruma.lookAt(camera.position.x, kuruma.position.y, camera.position.z);   // billboard (always show the car)
}

// ════════════════════════════════════════════════════════════════
// T009 — state machine  (Foundational)
// ════════════════════════════════════════════════════════════════
const Phase = { BUILDING:'building', READY:'ready', CRASHING:'crashing', SETTLING:'settling', RESET:'reset' };
let phase = Phase.BUILDING;
let started = false;   // becomes true when the title screen is dismissed
let buildTimer = 0, idleTime = 0, settleTimer = 0, crashTimer = 0, sinceSpawn = 0;
let runTime = 0, nextTaunt = 10, tauntT = 0, chaosTime = 0, calmT = 0;   // banner / intermission schedulers
const CALM_DUR = 15;   // quiet beat after defeating the boss before jenga resumes
const LURE_MSG = '👀 人間がいないぞ！ いまだ —— <b>Ctrl(⌘)+クリック</b>で暴れろ！';
const BOSS_MSG = '🔥 光る<b>おもちゃボス</b>を撃ち倒して、おもちゃカオスを止めろ！';

const tower = { list: [], topY: 0 };
const SPAWN_INTERVAL = 1.24;   // 2× slower stacking
const MIN_PIECES_TO_CRASH = 6;       // don't let it auto-collapse before it's a real tower (5+)
const CRASH_TRIGGER_SPEED = 5.2;     // m/s — minor settling wobbles ignored; only real topples/hits count
const SETTLE_KE = 0.4;
const SETTLE_TIMEOUT = 6.0;

function setPhase(next){
  phase = next;
  if (next === Phase.CRASHING){ crashTimer = 0; }
  if (next === Phase.SETTLING){ settleTimer = 0; }
  if (next === Phase.BUILDING){ buildTimer = SPAWN_INTERVAL * 0.5; }
}

// crash audio seam (FR-010 / FE-003) — plays assets/crash.mp3 scaled by impact strength
function onImpact(intensity){ playCrash(intensity); }

function spawnPieceOnTower(){
  const next = pieces.find(p => !p.inTower);
  if (!next) return;
  next.inTower = true;
  tower.list.push(next);
  const ang = Math.random()*Math.PI*2, rad = Math.random()*SPAWN_RADIUS;
  const x = Math.cos(ang)*rad, z = Math.sin(ang)*rad * 0.4;
  const y = tower.topY + next.halfH + 0.02;            // tiny gap → gentle settle, low impact
  next.body.wakeUp();
  next.body.velocity.setZero(); next.body.angularVelocity.setZero();
  next.body.position.set(x, y, z);
  next.body.quaternion.setFromEuler(0, Math.random()*Math.PI*2, (Math.random()-0.5)*0.05);  // less lean
  tower.topY = y + next.halfH;
  sinceSpawn = 0;
}

function maxTowerSpeed(){
  let m = 0;
  for (const p of tower.list){ const v = p.body.velocity; const s = Math.hypot(v.x,v.y,v.z); if (s>m) m=s; }
  return m;
}
function totalKE(){
  let ke = 0;
  for (const p of pieces){ const v=p.body.velocity, w=p.body.angularVelocity; ke += v.x*v.x+v.y*v.y+v.z*v.z + 0.3*(w.x*w.x+w.y*w.y+w.z*w.z); }
  return ke;
}
function triggerCrash(by){
  if (tower.list.length < MIN_PIECES_TO_CRASH) return;       // edge case: no/empty tower → no-op
  if (phase !== Phase.BUILDING && phase !== Phase.READY) return;
  const intensity = Math.min(1, maxTowerSpeed() / 12);       // louder for harder hits
  onImpact(intensity);
  setPhase(Phase.CRASHING);
}
function recyclePieces(){
  // Toy Story rule: toys never vanish — they stay where they fell ("play dead"),
  // and the builders pick them back up off the floor to re-stack. Just free them.
  for (const p of pieces) p.inTower = false;
  tower.list.length = 0; tower.topY = 0;
}

// ════════════════════════════════════════════════════════════════
// CHAOS MODE — hold the mouse still ("humans look away") → gravity vanishes,
// toys float in a crazy zero-g parade, and a TREASURE hides among them.
// ════════════════════════════════════════════════════════════════
const NORMAL_G = 18;
let chaosActive = false, chaosLevel = 0, chaosHold = false;   // chaos only via Ctrl/⌘+click

// treasure (otakara) — appears ONLY during chaos; made to feel special:
// the cutout glows (emissive), a pulsing golden halo blooms behind it, sparkles orbit, it floats.
function makeRadialGlowTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0, 64,64,64);
  g.addColorStop(0,   'rgba(255,240,200,1)');
  g.addColorStop(0.35,'rgba(255,225,150,0.55)');
  g.addColorStop(1,   'rgba(255,210,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const _glowTex = makeRadialGlowTex();
const treasure = new THREE.Group(); treasure.visible = false; scene.add(treasure);
const treasureCard = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0),
  new THREE.MeshStandardMaterial({ map:null, emissiveMap:null, emissive:0xffffff, emissiveIntensity:0.0,
    color:0xffffff, roughness:0.5, metalness:0.1, transparent:false, alphaTest:0.5, side:THREE.DoubleSide }));
treasureCard.castShadow = false; treasure.add(treasureCard);
const treasureHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map:_glowTex, color:0xFFE6A0, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true }));
treasureHalo.scale.set(2.6,2.6,1); treasure.add(treasureHalo);
const sparkles = [];
for (let i=0;i<7;i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:_glowTex, color:0xFFFFFF, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true }));
  sp.scale.setScalar(0.22); treasure.add(sp); sparkles.push(sp);
}
loadCutoutTexture('./assets/block/otakara.png').then(t => {
  treasureCard.material.map = t; treasureCard.material.emissiveMap = t; treasureCard.material.needsUpdate = true;
}).catch(err => console.warn('otakara load failed', err));
const treasureGlow = new THREE.PointLight(0xFFE08A, 0, 7, 2); scene.add(treasureGlow);
const treasureBody = new CANNON.Body({ mass: 0.5, shape: new CANNON.Sphere(0.4), allowSleep:false });
treasureBody.position.set(0, -30, 0); treasureBody.sleep(); world.addBody(treasureBody);

let treasureFx = 0;                       // >0 while the "found!" celebration plays
const flashEl = document.getElementById('flash');
const foundEl = document.getElementById('found');
const tauntEl = document.getElementById('taunt');
function foundTreasure(){
  if (treasureFx > 0) return;             // already collecting
  treasureFx = 1.2;                       // celebration timer (seconds)
  playBossHit();                          // boss-defeat SFX (assets/boss.mp3 if present)
  foundEl.style.transition = 'opacity .2s ease, transform .5s ease';
  foundEl.style.opacity = '1'; foundEl.style.transform = 'translateX(-50%) scale(1.1)';
}

function enterChaos(){
  // fling every toy into a floating cloud with random spin
  pieces.forEach((p) => {
    p.inTower = false;
    p.body.wakeUp();
    const a = Math.random()*Math.PI*2, r = 1.0 + Math.random()*2.6, h = 1.0 + Math.random()*3.2;
    p.body.position.set(Math.cos(a)*r, h, 0.8 + Math.sin(a)*r*0.5);
    p.body.velocity.set((Math.random()-0.5)*3, (Math.random()-0.5)*2.5, (Math.random()-0.5)*2);
    p.body.angularVelocity.set((Math.random()-0.5)*7,(Math.random()-0.5)*7,(Math.random()-0.5)*7);
  });
  tower.list.length = 0; tower.topY = 0;
  // hide the treasure somewhere in the swirling cloud
  treasure.visible = true; treasureBody.wakeUp();
  const a = Math.random()*Math.PI*2, r = 1.4 + Math.random()*1.2;
  treasureBody.position.set(Math.cos(a)*r, 2.4, 0.8 + Math.sin(a)*r*0.5);
  treasureBody.velocity.set((Math.random()-0.5)*2, 0.6, (Math.random()-0.5)*2);
  treasureBody.angularVelocity.set(2,3,1);
}
function exitChaos(){
  treasure.visible = false; treasureGlow.intensity = 0;
  treasureBody.sleep(); treasureBody.position.set(0,-30,0);
  setPhase(Phase.SETTLING);   // gravity returns (lerp) → toys rain down, settle, then rebuild
}
function chaosForces(){
  // swirl around the center + gather toward mid-height → a drifting "parade"
  for (const p of pieces){
    const pos = p.body.position;
    p.body.applyForce(new CANNON.Vec3(-pos.z*0.55, (2.5 - pos.y)*0.5, pos.x*0.55));
    if (Math.random() < 0.08) p.body.applyImpulse(new CANNON.Vec3((Math.random()-0.5)*0.5,(Math.random()-0.5)*0.5,(Math.random()-0.5)*0.4));
  }
  const tp = treasureBody.position;
  treasureBody.applyForce(new CANNON.Vec3(-tp.z*0.7, (2.6 - tp.y)*0.6, tp.x*0.7));
}

// ════════════════════════════════════════════════════════════════
// T017/T018 — pointer velocity + invisible wrecking-ball  (US2 / FR-005, FR-007)
// ════════════════════════════════════════════════════════════════
const pointer = { x: innerWidth/2, y: innerHeight/2, px: innerWidth/2, py: innerHeight/2, speed: 0, has:false };
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.has = true; });
addEventListener('touchmove', e => { if(e.touches[0]){ pointer.x=e.touches[0].clientX; pointer.y=e.touches[0].clientY; pointer.has=true; } }, {passive:true});

const raycaster = new THREE.Raycaster();
const planeZ0 = new THREE.Plane(new THREE.Vector3(0,0,1), 0);   // vertical plane through tower center
const _ndc = new THREE.Vector2(), _hit = new THREE.Vector3();
function raycastHitsTreasure(){
  if (!treasure.visible) return false;
  _ndc.set((pointer.x/innerWidth)*2-1, -(pointer.y/innerHeight)*2+1);
  raycaster.setFromCamera(_ndc, camera);
  return raycaster.intersectObject(treasureCard, false).length > 0;
}
function pointerToWorld(){
  _ndc.set((pointer.x/innerWidth)*2-1, -(pointer.y/innerHeight)*2+1);
  raycaster.setFromCamera(_ndc, camera);
  return raycaster.ray.intersectPlane(planeZ0, _hit) ? _hit : null;
}

const SWING_THRESHOLD = 1100;    // px/s — below → wrecking ball barely moves → no crash
const ballBody = new CANNON.Body({ type: CANNON.Body.KINEMATIC, shape: new CANNON.Sphere(0.55), collisionResponse: true });
ballBody.position.set(0, -20, 0);
world.addBody(ballBody);
let ballInit = false;

// ════════════════════════════════════════════════════════════════
// T019 — toy cannon projectiles (click/tap)  (US2 / FR-006)
// ════════════════════════════════════════════════════════════════
const PROJECTILES = 6;
const cannonballs = [];
for (let i=0;i<PROJECTILES;i++){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.26,18,18),
    new THREE.MeshStandardMaterial({ color: 0x3a3f47, roughness:0.35, metalness:0.6 }));
  mesh.castShadow = true; mesh.visible = false; scene.add(mesh);
  const body = new CANNON.Body({ mass: 3.0, shape: new CANNON.Sphere(0.26) });
  body.position.set(0,-30,0); body.sleep(); world.addBody(body);
  cannonballs.push({ mesh, body, life: 0, active:false });
}
let cbCursor = 0;
function fireCannon(){
  const target = pointerToWorld(); if (!target) return;
  const cb = cannonballs[cbCursor]; cbCursor = (cbCursor+1)%PROJECTILES;
  const origin = new THREE.Vector3(camera.position.x*0.4, 0.6, camera.position.z - 1.2);  // low front "cannon"
  const dir = new THREE.Vector3().subVectors(target, origin).normalize();
  cb.body.wakeUp();
  cb.body.position.set(origin.x, origin.y, origin.z);
  cb.body.velocity.set(dir.x*26, dir.y*26 + 2.0, dir.z*26);
  cb.body.angularVelocity.setZero();
  cb.active = true; cb.life = 0; cb.mesh.visible = true;
}
addEventListener('pointerdown', (e) => {
  if (!started) return;                                              // ignore clicks until the title is dismissed
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.has = true;   // fresh coords for the raycast
  if (e.ctrlKey || e.metaKey){ chaosHold = true; }    // Ctrl/⌘+click → ENTER Chaos Mode (humans look away)
  else if (chaosHold){
    // chaos ends ONLY by defeating the boss — empty clicks do nothing
    if (treasureFx <= 0 && raycastHitsTreasure()) foundTreasure();
  }
  else fireCannon();                                  // otherwise → fire the toy cannon
});

// ════════════════════════════════════════════════════════════════
// Ambient music: default "Chaotic Toy Parade", idle "When Humans Look Away"
// (crossfaded by pointer-idle state; started on first user gesture — autoplay policy)
// NOTE: the crash "ガシャン" SFX is still deferred (onImpact no-op / FE-003).
// ════════════════════════════════════════════════════════════════
const soundHint = document.getElementById('sound-hint');
const musActive = new Audio('./assets/Chaotic%20Toy%20Parade.mp3');     // normal / busy toys (URL-encoded)
const musIdle   = new Audio('./assets/When%20Humans%20Look%20Away.mp3');  // when the pointer goes still
[musActive, musIdle].forEach(a => {
  a.loop = true; a.preload = 'auto'; a.volume = 0;
  a.addEventListener('error', () => { soundHint.innerHTML = '⚠️ 音声読込失敗 code=' + (a.error && a.error.code); });
});
let audioStarted = false, audioPending = false;

// crash SFX pool — plays the moment the tower is smashed (volume scaled by impact strength).
// Drop a file at assets/crash.mp3 and it works automatically; absent → silently skipped.
const CRASH_SRC = './assets/crash.mp3';
const crashPool = Array.from({length: 4}, () => { const a = new Audio(CRASH_SRC); a.preload='auto'; return a; });
let crashCursor = 0, crashAvailable = true;
crashPool[0].addEventListener('error', () => { crashAvailable = false; });   // no file yet → skip
function playCrash(intensity){
  if (!crashAvailable) return;
  const a = crashPool[crashCursor]; crashCursor = (crashCursor+1) % crashPool.length;
  try { a.currentTime = 0; a.volume = Math.max(0.3, Math.min(1, intensity)); a.play().catch(()=>{}); } catch(e){}
}

// bounce/impact SFX — Cartoon Foley on hard piece collisions (throttled, gesture-gated)
const FOLEY_SRC = './assets/Cartoon%20Foley.mp3';
const foleyPool = Array.from({length: 5}, () => { const a = new Audio(FOLEY_SRC); a.preload='auto'; return a; });
let foleyCursor = 0, foleyAvailable = true, lastFoley = 0;
foleyPool[0].addEventListener('error', () => { foleyAvailable = false; });
function playBounce(strength){
  if (!foleyAvailable || !audioStarted || chaosActive) return;   // silent during chaos (don't break the mood)
  const now = performance.now();
  if (now - lastFoley < 300) return;                // throttle: at most ~3/sec, not a flurry
  lastFoley = now;
  const a = foleyPool[foleyCursor]; foleyCursor = (foleyCursor+1) % foleyPool.length;
  try { a.currentTime = 0; a.volume = Math.max(0.15, Math.min(1, strength)); a.play().catch(()=>{}); } catch(e){}
}

// boss-defeat SFX — plays when the glowing おもちゃボス is shot (drop assets/boss.mp3; absent → skipped)
const bossSfx = new Audio('./assets/boss.mp3'); bossSfx.preload = 'auto';
let bossSfxAvailable = true;
bossSfx.addEventListener('error', () => { bossSfxAvailable = false; });
function playBossHit(){
  if (!bossSfxAvailable || !audioStarted) return;   // plays even in chaos (it's the payoff)
  try { bossSfx.currentTime = 0; bossSfx.volume = 1.0; bossSfx.play().catch(()=>{}); } catch(e){}
}
function onPieceCollide(e){
  const s = Math.abs(e.contact ? e.contact.getImpactVelocityAlongNormal() : 0);
  if (s > 3.2) playBounce(Math.min(1, s/8));         // only the harder hits, scaled by impact
}
pieces.forEach(p => p.body.addEventListener('collide', onPieceCollide));
cannonballs.forEach(cb => cb.body.addEventListener('collide', onPieceCollide));
treasureBody.addEventListener('collide', onPieceCollide);
function startAudio(){
  if (audioStarted || audioPending) return;
  audioPending = true;
  // only mark started once playback ACTUALLY succeeds (a blocked play() must not lock us out)
  Promise.allSettled([ musActive.play(), musIdle.play() ]).then(results => {
    audioPending = false;
    if (results.some(r => r.status === 'fulfilled')){ audioStarted = true; soundHint.style.display = 'none'; }
  });
}
addEventListener('pointerdown', startAudio);
addEventListener('keydown', startAudio);
addEventListener('touchstart', startAudio, { passive:true });

// ════════════════════════════════════════════════════════════════
// T028 — pause when tab hidden (no physics blow-up on return)
// ════════════════════════════════════════════════════════════════
let hidden = false;
document.addEventListener('visibilitychange', () => { hidden = document.hidden; clock.getDelta(); });

// ════════════════════════════════════════════════════════════════
// main loop
// ════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- pointer speed ---
  const dx = pointer.x - pointer.px, dy = pointer.y - pointer.py;
  pointer.speed = dt > 0 ? Math.hypot(dx,dy)/dt : 0;
  pointer.px = pointer.x; pointer.py = pointer.y;
  if (pointer.speed < 60) idleTime += dt; else idleTime = 0;

  // --- ambient music crossfade: chaos OR idle → "When Humans Look Away", else "Chaotic Toy Parade" ---
  if (audioStarted){
    const idleNow = chaosHold || chaosActive || idleTime > 0.6;   // Ctrl+click chaos forces the humans-look-away track
    const fade = Math.min(dt * 1.6, 1);                   // ~0.6s crossfade
    const aTarget = idleNow ? 0.0 : 0.85, iTarget = idleNow ? 0.85 : 0.0;
    musActive.volume += (aTarget - musActive.volume) * fade;
    musIdle.volume   += (iTarget - musIdle.volume)   * fade;
  }

  // --- wrecking ball follows projected cursor continuously; only COLLIDES when swung fast (FR-007) ---
  const target = pointer.has ? pointerToWorld() : null;
  if (target){
    if (!ballInit){ ballBody.position.set(target.x, target.y, 0); ballInit = true; }
    const C = 45;
    const vx = (target.x - ballBody.position.x)/Math.max(dt,1e-3);
    const vy = (target.y - ballBody.position.y)/Math.max(dt,1e-3);
    ballBody.velocity.set(Math.max(-C,Math.min(C,vx)), Math.max(-C,Math.min(C,vy)), 0);
    // slow drift passes through harmlessly; a fast swing becomes a solid impactor
    ballBody.collisionResponse = pointer.speed > SWING_THRESHOLD;
  } else {
    ballBody.position.set(0,-20,0); ballBody.velocity.setZero(); ballBody.collisionResponse = false;
  }

  // --- chaos mode: Ctrl/⌘+click ENTERS, a normal click ENDS it (move freely to hunt the treasure) ---
  const wantChaos = started && chaosHold;
  if (wantChaos && !chaosActive){ chaosActive = true; enterChaos(); }
  else if (!wantChaos && chaosActive){ chaosActive = false; exitChaos(); nextTaunt = runTime + 14 + Math.random()*8; tauntT = 0; }  // cooldown before the next lure
  chaosLevel += ((chaosActive ? 1 : 0) - chaosLevel) * Math.min(dt*3, 1);
  world.gravity.y = -NORMAL_G * (1 - chaosLevel);
  if (chaosActive) chaosForces();
  // banners: normal mode → lure the Ctrl/⌘+click; chaos mode → after a beat, "defeat the boss toy" goal
  if (chaosActive){
    chaosTime += dt; tauntT = 0;
    if (chaosTime > 4){ tauntEl.innerHTML = BOSS_MSG; tauntEl.style.opacity = '1'; }
    else tauntEl.style.opacity = '0';
  } else {
    chaosTime = 0;
    if (calmT > 0){
      // post-boss calm beat: messages, no lure, jenga paused
      calmT -= dt; tauntT = 0; tauntEl.style.opacity = '0';
      if (calmT < CALM_DUR - 4 && calmT > 0.6) foundEl.innerHTML = '🚪 もう直ぐ 人が帰ってくるはず…';
      if (calmT <= 0.6){ foundEl.style.opacity = '0'; foundEl.style.transform = 'translateX(-50%) scale(0.8)'; }
      nextTaunt = runTime + 12 + Math.random()*8;   // hold the lure off after the calm too
    } else {
      if (started){
        runTime += dt;
        if (tauntT > 0) tauntT -= dt;
        else if (runTime >= nextTaunt){ tauntT = 4.5; nextTaunt = runTime + 9 + Math.random()*9; tauntEl.innerHTML = LURE_MSG; }
      }
      let tOp = 0;
      if (tauntT > 0){ tOp = Math.max(0, Math.min(1, Math.min((4.5 - tauntT)/0.4, tauntT/0.7))); }
      tauntEl.style.opacity = tOp.toFixed(2);
    }
  }

  // --- physics (collapse plays at half speed for a satisfying slow-mo fall) ---
  const slowmo = (phase === Phase.CRASHING || phase === Phase.SETTLING) ? 0.5 : 1.0;
  stepPhysics(dt * slowmo);
  sinceSpawn += dt;

  // --- state machine (only after the title is dismissed; suspended while chaos reigns) ---
  if (started && !chaosActive){
    if (phase === Phase.BUILDING){
      buildTimer -= dt;
      if (calmT <= 0 && buildTimer <= 0 && tower.list.length < TOWER_TARGET){ spawnPieceOnTower(); buildTimer = SPAWN_INTERVAL; }
      if (tower.list.length >= TOWER_TARGET) setPhase(Phase.READY);
      if (sinceSpawn > 0.4 && maxTowerSpeed() > CRASH_TRIGGER_SPEED) triggerCrash('auto');
    } else if (phase === Phase.READY){
      if (maxTowerSpeed() > CRASH_TRIGGER_SPEED) triggerCrash('auto');   // covers self-topple + impacts
    } else if (phase === Phase.CRASHING){
      crashTimer += dt;
      if (crashTimer > 0.6) setPhase(Phase.SETTLING);
    } else if (phase === Phase.SETTLING){
      settleTimer += dt;
      if (totalKE() < SETTLE_KE || settleTimer > SETTLE_TIMEOUT) setPhase(Phase.RESET);
    } else if (phase === Phase.RESET){
      recyclePieces();
      setPhase(Phase.BUILDING);
    }
  }

  // --- sync meshes (all pieces: chaos cloud + parked pool both track their bodies) ---
  for (const p of pieces) syncPiece(p);
  if (treasure.visible){
    treasure.position.copy(treasureBody.position);
    treasure.position.y += Math.sin(t*2.0)*0.08;                 // gentle float
    treasureCard.quaternion.copy(camera.quaternion);             // billboard the otakara so it always faces you
    const pulse = 0.5 + 0.5*Math.sin(t*4.0);
    treasureCard.material.emissiveIntensity = 0.5 + pulse*0.7;   // breathing self-glow
    treasureHalo.material.opacity = (0.35 + pulse*0.4) * chaosLevel;
    treasureHalo.scale.setScalar(2.3 + pulse*0.6);
    treasureGlow.position.copy(treasure.position);
    treasureGlow.intensity = (1.6 + pulse*1.4) * chaosLevel;     // pulsing golden light
    sparkles.forEach((sp, i) => {                                // orbiting twinkles
      const a = t*2.0 + i*(Math.PI*2/sparkles.length);
      sp.position.set(Math.cos(a)*0.72, Math.sin(a*1.3)*0.5, Math.sin(a)*0.72);
      const tw = 0.5 + 0.5*Math.sin(t*9 + i*1.7);
      sp.material.opacity = tw * chaosLevel; sp.scale.setScalar(0.12 + tw*0.18);
    });
    // --- "found!" celebration: bloom of light, treasure swells & rises, then it's collected ---
    if (treasureFx > 0){
      treasureFx -= dt;
      const k = 1 - Math.max(0, treasureFx) / 1.2;               // 0→1 over the celebration
      treasure.scale.setScalar(1 + k*1.6);
      treasure.position.y += k*1.2;                              // rises as it's collected
      treasureCard.material.emissiveIntensity = 1.5 + k*3;
      treasureHalo.material.opacity = 0.9; treasureHalo.scale.setScalar(2.5 + k*9);
      treasureGlow.intensity = 6 + k*10;
      flashEl.style.opacity = (Math.sin(Math.min(1,k)*Math.PI) * 0.9).toFixed(2);
      if (treasureFx <= 0){                                      // collected → tidy up + end chaos
        treasure.visible = false; treasure.scale.setScalar(1); flashEl.style.opacity = '0';
        chaosHold = false;                                       // humans look back → chaos ends
        calmT = CALM_DUR;                                        // calm intermission before jenga resumes
        foundEl.innerHTML = '🎉 無事 おもちゃカオスを止めた！';   // keep the banner up for the calm beat
        foundEl.style.opacity = '1'; foundEl.style.transform = 'translateX(-50%) scale(1.0)';
      }
    }
  }
  for (const cb of cannonballs){
    if (cb.active){
      cb.mesh.position.copy(cb.body.position); cb.mesh.quaternion.copy(cb.body.quaternion);
      cb.life += dt;
      if (cb.life > 3.2){ cb.active=false; cb.mesh.visible=false; cb.body.sleep(); cb.body.position.set(0,-30,0); }
    }
  }

  // --- roaming car (chaos only) ---
  updateKuruma(dt, t);

  // --- toy people: alive (wander) ONLY during chaos; frozen "play dead" in normal mode ---
  const figBaseY = FIGURE_H/2;
  builders.forEach((b, i) => {
    const w = b.userData.w;
    if (!chaosActive){
      w.moving = false; b.position.y = figBaseY;
      b.lookAt(camera.position.x, b.position.y, camera.position.z);   // face camera, stand frozen
      return;
    }
    if (w.pause > 0){ w.pause -= dt; w.moving = false; }
    else {
      const to = new THREE.Vector3().subVectors(w.target, w.pos); to.y = 0;
      if (to.length() < 0.18){ w.pause = 0.5 + Math.random()*2.0; pickBuilderTarget(w); w.moving = false; }
      else { to.normalize(); w.pos.addScaledVector(to, 1.0*dt); w.moving = true; }
    }
    if (w.moving) w.step += dt*9;
    b.position.set(w.pos.x, figBaseY + (w.moving ? Math.abs(Math.sin(w.step))*0.06 : 0), w.pos.z);
    b.lookAt(camera.position.x, b.position.y, camera.position.z);     // billboard
  });

  renderer.render(scene, camera);
}
try { animate(); } catch(e){ fatal(e); }

// ════════════════════════════════════════════════════════════════
// T027 — resize (keep tower framed, cover-fit backdrop)  (FR-014)
// ════════════════════════════════════════════════════════════════
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitBackdrop();
});

// ════════════════════════════════════════════════════════════════
// title screen → fade out into the running scene (scene animates behind it)
// ════════════════════════════════════════════════════════════════
const introEl = document.getElementById('intro');
let introDone = false;
function dismissIntro(){
  if (introDone) return; introDone = true;
  startAudio();                              // the first gesture also unlocks audio
  introEl.classList.add('hide');
  setTimeout(() => { introEl.style.display = 'none'; }, 1400);
  // start the toys ~after the fade so stacking begins fresh once the title clears
  setTimeout(() => { started = true; }, 700);
}
introEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); dismissIntro(); });   // don't fire the cannon
addEventListener('keydown', dismissIntro);
</script>
</body>
